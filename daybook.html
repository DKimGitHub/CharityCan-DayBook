<title>Team Daybook</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: date bar; one shared cork board split into four areas (top ~3/4); my desk for writing notes and the day's update (bottom ~1/4). Light green wall behind. */
:root {
  --bg: #e2f0d9;
  --surface: #f6fbf3;
  --surface-2: #d2e6c6;
  --line: #bcd4ae;
  --fg: #1b231b;
  --muted: #536453;
  --faint: #839583;
  --acc-light: #2d6a6f;
  --acc-dark: #7cc4c4;
  --accent: var(--acc-light);
  --on-accent: #ffffff;
  --soft: #3f5a77;
  --soft-bg: #e1e8f1;
  --warn: #8f5a0e;
  --warn-bg: #f5e8d2;
  --danger: #a3322a;

  --cork: #c9a274;
  --cork-dot-a: rgba(120, 80, 40, .11);
  --cork-dot-b: rgba(255, 240, 210, .12);
  --cork-edge: rgba(70, 45, 20, .35);
  --cork-line: rgba(70, 42, 16, .30);
  --tag-bg: rgba(255, 255, 255, .92);
  --paper-ink: #2b2618;
  --pin: #d2463c;
  --manila: #e7cf96;
  --manila-ink: #5b4518;
  --back: #ece3d2;
  --back-ink: #2e2a20;
  --back-line: rgba(80, 60, 30, .16);
  --hole: rgba(28, 16, 6, .7);

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-note: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive;

  --fs: 15px;
  --note-scale: 1;
  --radius: 12px;
  --dwin-bg: #f5f5f5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15211a; --surface: #1c2a21; --surface-2: #24362a; --line: #304636;
    --fg: #e3ece4; --muted: #a2b4a5; --faint: #6e8273;
    --accent: var(--acc-dark); --on-accent: #0d1512;
    --soft: #a9c3e4; --soft-bg: #1c2938; --warn: #e6b765; --warn-bg: #33270f; --danger: #f08c80;
    --cork: #7a5a3a; --cork-dot-a: rgba(30, 18, 8, .2); --cork-dot-b: rgba(255, 220, 170, .05); --cork-edge: rgba(0, 0, 0, .5);
    --cork-line: rgba(0, 0, 0, .45); --tag-bg: rgba(24, 34, 27, .92);
    --back: #2a2922; --back-ink: #e9e3d5; --back-line: rgba(255, 240, 210, .12); --hole: rgba(0, 0, 0, .75);
    --manila: #6b5a33; --manila-ink: #f3e6c4;
    --map-ca: #2a3d2f; --wood: #4d6e53;
    --dwin-bg: #242424;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15211a; --surface: #1c2a21; --surface-2: #24362a; --line: #304636;
  --fg: #e3ece4; --muted: #a2b4a5; --faint: #6e8273;
  --accent: var(--acc-dark); --on-accent: #0d1512;
  --soft: #a9c3e4; --soft-bg: #1c2938; --warn: #e6b765; --warn-bg: #33270f; --danger: #f08c80;
  --cork: #7a5a3a; --cork-dot-a: rgba(30, 18, 8, .2); --cork-dot-b: rgba(255, 220, 170, .05); --cork-edge: rgba(0, 0, 0, .5);
  --cork-line: rgba(0, 0, 0, .45); --tag-bg: rgba(24, 34, 27, .92);
  --back: #2a2922; --back-ink: #e9e3d5; --back-line: rgba(255, 240, 210, .12); --hole: rgba(0, 0, 0, .75);
  --manila: #6b5a33; --manila-ink: #f3e6c4;
  --map-ca: #2a3d2f; --wood: #4d6e53;
  --dwin-bg: #242424;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: var(--fs); line-height: 1.5; }
.site-brand { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.site-logo { width: 26px; height: 26px; object-fit: contain; flex: none; }
.site-title { font-family: "Space Grotesk", var(--f-display); font-weight: 700; font-size: 1.25em; letter-spacing: .01em; color: var(--fg); }
body[data-size="s"] { --note-scale: .88; }
body[data-size="l"] { --note-scale: 1.15; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.lbl { font-size: .74em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hint { color: var(--faint); font-size: .82em; }

:root { --rail-w: 54px; }
.upper { display: flex; gap: 12px; min-height: 0; }
.upper-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.rail {
  position: relative; flex: none; width: var(--rail-w); box-sizing: border-box; padding: 4px 0 0 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.rail::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 1px; background: var(--line); }
.rail-line { display: none; }
/* Three groups: Add at the top, History and Settings in the middle, the trash at the bottom. */
.rail { display: grid !important; grid-template-rows: 1fr auto 1fr; justify-items: center; }
.rail-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rail-group.top { align-self: start; }
.rail-group.bottom { align-self: end; }
.rail-btn[aria-pressed="true"] { color: var(--fg); background: var(--surface-2); }
.rail-btn { width: 46px; border: 0; background: transparent; border-radius: 10px; padding: 7px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: .66em; font-weight: 700; line-height: 1.1; }
.rail-btn svg { width: 20px; height: 20px; }
.rail-btn span { white-space: nowrap; font-size: .94em; }
.rail-btn:hover { color: var(--fg); background: var(--surface-2); }
.trash { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--faint); transition: background .2s, color .2s, transform .2s; }
.trash svg { width: 24px; height: 24px; overflow: visible; }
.trash .lid { transform-box: fill-box; transform-origin: 100% 100%; transition: transform .2s; }
body.carrying .trash { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
.trash.hot { transform: scale(1.12); background: color-mix(in srgb, var(--danger) 20%, transparent) !important; }
.note-ghost { transition: transform .15s, opacity .15s; }
.note-ghost.into-trash { transform: rotate(-8deg) scale(.32); opacity: .75; transform-origin: 50% 12px; }
.trash.hot .lid { transform: rotate(-24deg) translate(-1px, -2px); }
@media (max-width: 560px) { :root { --rail-w: 46px; } .rail-btn { width: 44px; } .rail-btn span { display: none; } .trash { width: 44px; height: 44px; } }
.app { display: flex; flex-direction: column; gap: 12px; min-height: 100%; box-sizing: border-box; padding-inline: 16px; padding-block: 0 16px; max-width: 1600px; margin: 0 auto; }

/* Top bar */
.top { position: relative; display: flex; align-items: center; padding-block: 12px 0; min-height: 52px; }
.brand { position: relative; z-index: 2; }
/* The page background is a map of Canada, stretched so the four cities' windows sit in the space below the board
   (measured with the desk closed); it stays put when the desk opens. */
:root:not([data-theme="dark"]) { --map-ca: #bcd6ab; --wood: #7fa56b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --map-ca: #2a3d2f; --wood: #4d6e53; } }
.page-map { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.page-map svg { width: 100%; height: 100%; display: block; }
.map-ca { fill: var(--map-ca); }
.map-lake { fill: var(--bg); }
.page-cities { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
body:not(.show-map) .page-map, body:not(.show-map) .page-cities { display: none; }
.app { position: relative; z-index: 1; }
/* Each city gets a little framed window with a cross bar, like peering into their world. */
/* Storybook cottage windows: an arched top, a flat frame and cross bars, in the map's greens. */
.window { position: absolute; width: 30px; height: 36px; transform: translate(-50%, -50%); box-sizing: border-box; padding: 3.5px 3.5px 4px;
  border-radius: 50% 50% 4px 4px / 36% 36% 4px 4px; background: var(--wood); }
.window .sky { width: 100%; height: 100%; border-radius: 50% 50% 2px 2px / 32% 32% 2px 2px; box-shadow: none; }
.window::before, .window::after { content: ""; position: absolute; z-index: 2; background: var(--wood); }
.window::before { left: calc(50% - 1.5px); top: 4px; bottom: 4px; width: 3px; }
.window::after { top: calc(56% - 1.5px); left: 3.5px; right: 3.5px; height: 3px; }
@media (max-width: 720px) {
  .window { width: 22px; height: 27px; padding: 2.5px 2.5px 3px; }
  .window::before { left: calc(50% - 1px); width: 2px; top: 3px; bottom: 3px; }
  .window::after { top: calc(56% - 1px); height: 2px; left: 2.5px; right: 2.5px; }
}
/* Sky windows: each city's real time of day and moon, worked out from the sun's position. */
.sky { position: relative; flex: none; display: block; width: 168px; height: 40px; border-radius: 20px; overflow: hidden; background: var(--sky, #9ccbef);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .25), 0 0 0 3px var(--surface); transition: background 2s; }
.sky .orb { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; }
.sky .sun { background: radial-gradient(circle at 40% 40%, #fff7c2, color-mix(in srgb, #ffd45e, #ff8a3d calc(var(--warm, 0) * 100%)) 60%, #f6a93b); box-shadow: 0 0 12px 4px rgba(255, 190, 94, .55); }
.sky .moon svg { width: 12px; height: 12px; display: block; filter: drop-shadow(0 0 4px rgba(255, 255, 230, .5)); }
.sky .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .8; }
.sky .cloud { position: absolute; height: 10px; border-radius: 10px; background: rgba(255, 255, 255, .75); filter: blur(1.5px); }
.sky .hill { position: absolute; left: -10%; right: -10%; bottom: -11px; height: 18px; border-radius: 50%; background: var(--hill, #a6c895); }
@media (prefers-reduced-motion: no-preference) {
  .sky .cloud { animation: drift var(--drift, 60s) linear infinite; }
  .sky .star { animation: twinkle 3.5s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-60px); } to { transform: translateX(240px); } }
  @keyframes twinkle { from { opacity: .25; } to { opacity: .95; } }
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.eyebrow { font-size: .72em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.6em; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; }
.actions { display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 12px; font-size: .92em;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.btn.small { padding: 4px 10px; font-size: .85em; }
.btn svg { width: 16px; height: 16px; }
.notice { padding: 8px 14px; border-radius: 8px; background: var(--soft-bg); color: var(--soft); font-size: .9em; }

/* Shared cork texture */
.cork, .board, .face.front, .cork-board {
  background-color: var(--cork);
  background-image:
    radial-gradient(circle at 20% 30%, var(--cork-dot-a) 0 1px, transparent 1.6px),
    radial-gradient(circle at 70% 60%, var(--cork-dot-a) 0 1.2px, transparent 2px),
    radial-gradient(circle at 40% 80%, var(--cork-dot-b) 0 1px, transparent 1.6px),
    radial-gradient(circle at 85% 15%, var(--cork-dot-b) 0 .8px, transparent 1.4px);
  background-size: 13px 13px, 19px 17px, 17px 21px, 11px 12px;
  box-shadow: inset 0 0 0 1px var(--cork-edge), inset 0 2px 10px rgba(0, 0, 0, .18);
}

/* The public board: one cork, four areas */
.board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: var(--radius); overflow: hidden; isolation: isolate; }  /* keep the board's layers below the side panels */
.board[data-layout="row"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.board[data-layout="stack"] { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 1100px) { .board[data-layout="row"] { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .board, .board[data-layout="row"] { grid-template-columns: minmax(0, 1fr); } }

/* Cork: one continuous board; the four topics are a cosmetic overlay (cross lines and labels), not separate containers. */
.board[data-layout="cork"] { display: flex; background: none; box-shadow: none; border-radius: 0; overflow: visible; }
.cork-board { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: var(--radius); overflow: hidden; container-type: size; }
.cork-board .note { --nw: min(calc(54px + 6.5cqh), 10cqw); }
.cork-cross { position: absolute; inset: 0; pointer-events: none; }
.cork-cross::before, .cork-cross::after { content: ""; position: absolute; background: var(--cork-line); }
.cork-cross::before { left: 50%; top: 0; bottom: 0; width: 1px; margin-left: -.5px; }
.cork-cross::after { top: 50%; left: 0; right: 0; height: 1px; margin-top: -.5px; }
.cork-qlabel {
  position: absolute; top: 0; margin-top: 12px; transform: translateX(-50%); z-index: 1; pointer-events: none;
  display: inline-flex; align-items: center; padding: 4px 14px; border-radius: 6px;
  background: rgba(0, 0, 0, .32); color: #fff8ec; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); font-weight: 700;
}
.cork-drop-hl {
  position: absolute; width: 50%; height: 50%; pointer-events: none;
  outline: 3px dashed var(--accent); outline-offset: -8px; opacity: 0; transition: left .12s, top .12s, opacity .12s;
}
.cork-drop-hl.show { opacity: 1; }

.quad { min-width: 0; }
.flipper { position: relative; height: 100%; }
.face { box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 8px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face.front { position: relative; height: 100%; padding: 0; box-shadow: inset 0 0 0 1px var(--cork-line), inset 0 2px 8px rgba(0, 0, 0, .14); }
/* The name row floats over the cork, so notes can sit beside the tag. */
.face.front > .q-head { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1100; pointer-events: none; }
.face.front > .q-head > * { pointer-events: auto; }
/* On the cork the tag has no card behind it; light text with a soft shadow keeps the name readable. */
.face.front .name-tag { background: transparent; box-shadow: none; padding-left: 0; color: #fff8ec; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
.face.front .name-tag .you { color: inherit; opacity: .8; }
.face.front .name-tag .upd-icon { color: #fff8ec; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .5)); }
.face.front .name-tag .av { box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.face.front .upd-pop { text-shadow: none; }
.tasklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.task { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 2px; border-bottom: 1px solid var(--back-line); }
.task:last-child { border-bottom: 0; }
.task .chip-dot { width: 10px; height: 10px; border-radius: 2px; margin-top: 6px; background: var(--paper); box-shadow: 0 0 0 1px rgba(0, 0, 0, .2); }
.task .t { overflow-wrap: anywhere; white-space: pre-wrap; }
.q-head { display: flex; align-items: center; gap: 8px; position: relative; z-index: 5; min-height: 32px; }
.name-tag {
  position: relative; display: inline-flex; align-items: center; gap: 8px; min-width: 0;
  padding: 3px 12px 3px 3px; border-radius: 999px; background: var(--tag-bg); box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
}
.name-tag.has-update { cursor: help; }
.av { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: .9em; background: var(--surface-2); color: var(--muted); }
.quad.mine .av { background: var(--accent); color: var(--on-accent); }
.av.custom, .quad.mine .av.custom { background: var(--av); color: #2b2618; }
.av.emoji { font-family: "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", sans-serif; font-weight: 400; line-height: 1; }
.av-btn { border: 0; background: transparent; padding: 0; border-radius: 50%; display: inline-grid; }
.av-btn:hover .av { box-shadow: 0 0 0 2px var(--accent); }
.av-preview { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.av-preview .av { width: 44px; height: 44px; font-size: 1.35em; }
.av-th { overflow: hidden; padding: 0; background: transparent; }
.av-th svg { display: block; width: 100%; height: 100%; }
.av-big { width: 96px; height: 96px; }
.pick-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 76px)); gap: 8px; }
.pick-grid button { padding: 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.pick-grid button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.pick-av { width: 100%; height: auto; aspect-ratio: 1; }
/* Thumbs motion: the body sways or bounces from its base; the eyes blink now and then. */
.av-th .th-sway { transform-box: view-box; transform-origin: 50% 100%; }
.av-th .th-eyes { transform-box: fill-box; transform-origin: 50% 50%; }
@media (prefers-reduced-motion: no-preference) {
  .av-th.mo-sway .th-sway { animation: th-sway var(--sway, 3.6s) ease-in-out var(--d, 0s) infinite alternate; }
  .av-th.mo-bounce .th-sway { animation: th-bounce var(--bounce, 1.8s) cubic-bezier(.3, .6, .4, 1) var(--d, 0s) infinite; }
  .av-th:not(.mo-still) .th-eyes { animation: th-blink var(--blink, 4.8s) linear var(--d, 0s) infinite; }
  .name-tag:hover .av-th .th-sway, .av-btn:hover .av-th .th-sway { animation: th-hop .6s cubic-bezier(.3, .6, .4, 1) 1; }
  @keyframes th-sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  @keyframes th-bounce { 0%, 100% { transform: translateY(0) scale(1, 1); } 15% { transform: translateY(0) scale(1.06, .94); } 45% { transform: translateY(-9%) scale(.97, 1.04); } 75% { transform: translateY(0) scale(1.03, .97); } }
  @keyframes th-blink { 0%, 90%, 96%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.1); } }
  @keyframes th-hop { 0% { transform: translateY(0); } 40% { transform: translateY(-14%) rotate(-8deg); } 70% { transform: translateY(0) rotate(4deg); } 100% { transform: translateY(0); } }
}
.name-tag .av { width: 30px; height: 30px; }
.av-builder { display: flex; flex-direction: column; gap: 10px; }
.av-top { display: flex; align-items: center; gap: 14px; }
.av-top .av { flex: none; }
.av-top .who { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.av-tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 9px; width: fit-content; max-width: 100%; flex-wrap: wrap; }
.av-tabs button { border: 0; background: transparent; border-radius: 6px; padding: 5px 12px; font-size: .9em; color: var(--muted); }
.av-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 700; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.av-sub { font-size: .78em; font-weight: 700; color: var(--muted); margin-top: 2px; }
.tiles button { width: 52px; height: 52px; padding: 2px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: .72em; color: var(--muted); }
.tiles button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.swatch.sm { width: 26px; height: 26px; }
.av-grid { display: grid; grid-template-columns: repeat(auto-fill, 38px); gap: 6px; }
.av-grid button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 19px; padding: 0; font-family: "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", var(--f-body); }
.av-grid button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.name { font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name .you { font-weight: 400; color: var(--faint); font-size: .85em; margin-left: 4px; }
.upd-icon { width: 15px; height: 15px; color: var(--accent); flex: none; }
.upd-pop {
  display: none; position: absolute; top: calc(100% + 8px); left: 0; width: max-content; max-width: min(340px, 72vw);
  background: var(--surface); color: var(--fg); border-radius: 10px; padding: 12px 14px; cursor: auto;
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .45), 0 0 0 1px var(--line);
}
/* Speech-bubble tail pointing up at the avatar. */
.upd-pop::before { content: ""; position: absolute; top: -6px; left: 9px; width: 11px; height: 11px; background: var(--surface); transform: rotate(45deg); box-shadow: -1px -1px 0 0 var(--line); border-radius: 2px 0 0 0; }
.upd-pop p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.name-tag:hover .upd-pop, .name-tag:focus .upd-pop, .name-tag:focus-within .upd-pop, .name-tag.peek .upd-pop { display: block; }
.name-tag.peek .upd-pop { animation: bubble-in .22s cubic-bezier(.3, 1.4, .5, 1); }

.pill { flex: none; font-size: .72em; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--tag-bg); color: var(--muted); }

.cork { position: relative; aspect-ratio: 4 / 3; width: 100%; border-radius: var(--radius); overflow: hidden; container-type: size; }

  text-align: center; padding: 16px; pointer-events: none; color: #fff8ec; text-shadow: 0 1px 2px rgba(0, 0, 0, .45); font-size: .95em;

/* Sticky notes on the board */
.note {
  --nw: min(calc(54px + 13cqh), 20cqw);   /* square; grows gently with the area's height, never wider than 20% (matches noteSide) */

  padding: max(calc(var(--nw) * .19), 12px) calc(var(--nw) * .094) calc(var(--nw) * .094); border: 0; text-align: left;
  background: var(--paper, #fff3a3); color: var(--paper-ink);
  font-family: var(--f-note); font-size: calc(var(--nw) * .1 * var(--note-scale)); line-height: 1.18;

  content: ""; position: absolute; top: 2.2%; left: 50%; width: calc(var(--nw) * .124); height: calc(var(--nw) * .124); min-width: 8px; min-height: 8px; translate: -50% 0; border-radius: 50%;

/* Hearts sit in the note's bottom-right corner: shown when someone has hearted it, or on hover for a teammate's note. */

  font: 700 max(11px, calc(var(--nw) * .11)) / 1 var(--f-body, system-ui); color: rgba(60, 40, 20, .35); border-radius: 999px; padding: 2px 3px; opacity: 0; transition: opacity .15s, transform .15s; }
.note .heart svg { width: max(13px, calc(var(--nw) * .15)); height: max(13px, calc(var(--nw) * .15)); }

@keyframes heart-pop { 0% { transform: scale(.6); } }

/* Who hearted a note: a small card above the heart, outside the note so it isn't clipped. */
.heart-who { position: fixed; z-index: 4000; pointer-events: none; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 8px 8px; border-radius: 10px;
  background: var(--surface); color: var(--fg); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .45), 0 0 0 1px var(--line); font-size: .86em; font-weight: 600; animation: bubble-in .18s ease-out; }
.heart-who > span { display: flex; align-items: center; gap: 8px; white-space: nowrap; }

.heart-who .hw-heart { color: #e0456a; width: 12px; height: 12px; }
.note.own:active { cursor: grabbing; }
.note.dragging { box-shadow: 0 2px 3px rgba(0, 0, 0, .2), 0 16px 22px -10px rgba(0, 0, 0, .55); transform: rotate(var(--rot, 0deg)) scale(1.04); z-index: 999 !important; }
.note.dim { opacity: .3; }
.note.flash { outline: 3px solid var(--accent); outline-offset: 2px; }

/* My desk (bottom) */
.panel { --row-h: 136px; background: var(--surface); border-radius: var(--radius); padding: 14px; display: grid; grid-template-columns: minmax(220px, 1fr) minmax(0, 2.6fr); gap: 18px; min-height: 0; box-sizing: border-box; }
/* The desk: closed by default, the board sits centred with an Add to Daybook button below it. */
.app { position: relative; }

.panel { padding-right: 48px; }

.panel.single { display: flex; flex-direction: column; gap: 10px; justify-content: center; }

.field { width: 100%; box-sizing: border-box; border: 1px solid transparent; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; min-width: 0; }

.upd-send { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); display: grid; place-items: center; }
.upd-send:hover { color: var(--accent); background: var(--surface-2); }

.note-row { flex: 1; display: flex; gap: 14px; overflow-x: auto; overflow-y: hidden; padding: 6px 2px 8px; height: var(--row-h); flex: none; box-sizing: border-box; align-items: flex-start; }

.card {
  flex: 0 0 112px; width: 112px; height: 112px; display: flex; flex-direction: column; gap: 6px; padding: 10px; box-sizing: border-box;
  background: var(--paper, #fff1a1); color: var(--paper-ink); border-radius: 3px;
  box-shadow: 0 1px 1px rgba(0, 0, 0, .12), 0 6px 10px -7px rgba(0, 0, 0, .4);
}
.card.flash { outline: 3px solid var(--accent); outline-offset: 2px; }
.card-grip { display: flex; align-items: center; gap: 6px; margin: -4px -4px 0; padding: 3px 4px; border-radius: 3px; cursor: grab; touch-action: none; user-select: none; font-size: .74em; font-weight: 700; letter-spacing: .04em; color: rgba(43, 38, 24, .6); }

.card { position: relative; padding: 8px !important; }
.card.drop-before::before, .card.drop-after::after { content: ""; position: absolute; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: var(--accent); }

  aspect-ratio: 1 / 1; line-height: 1.18 !important;
  position: fixed; z-index: 3000; pointer-events: none; box-sizing: border-box; padding: 10px 10px 12px;
  background: var(--paper); color: var(--paper-ink); font-family: var(--f-note); line-height: 1.25; white-space: pre-wrap; overflow: hidden;
  box-shadow: 0 2px 3px rgba(0, 0, 0, .2), 0 18px 26px -12px rgba(0, 0, 0, .55); transform: rotate(-2deg);
}
.panel.drop-target { outline: 3px dashed var(--accent); outline-offset: -6px; }
.board .cork.drop-target { outline: 3px dashed var(--accent); outline-offset: -8px; }
.card textarea { flex: 1; min-height: 0; resize: none; border: 0; padding: 0; background: transparent; font-family: var(--f-note); font-size: 1.12em; line-height: 1.18; overflow: hidden; color: var(--paper-ink); outline: none; }
/* The list box takes exactly the notes row's place, so opening it doesn't move the page. */
.list-box { flex: none; height: var(--row-h); box-sizing: border-box; padding: 6px 2px 8px; display: flex; flex-direction: column; gap: 6px; }
.list-box textarea { flex: 1; min-height: 0; resize: none; }
.list-actions { display: flex; gap: 8px; }
.card-tools { display: flex; align-items: center; gap: 3px; }
.card-tools .del-x { margin-left: auto; width: 18px; height: 18px; padding: 0; display: grid; place-items: center; }
.card-tools .del-x svg { width: 14px; height: 14px; }
.card-tools .grow { flex: 1; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .25); padding: 0; background: var(--paper); }
.dot[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper-ink); }

/* Desktop: board fills the top three quarters, desk the bottom quarter. */
@media (min-width: 721px) and (min-height: 560px) {
  .app { height: 100%; }

  .stage .board[data-layout="cork"] .cork-board { aspect-ratio: auto; flex: 1; min-height: 0; }
  .stage .board[data-layout="stack"] .quad { min-height: 0; }

  .desk { flex: 1 1 0; min-height: 210px; z-index: 1; }
  /* The date sits in the bottom-left corner, under the desk when it's open; the board takes the space it left. */
  .app { padding-top: 14px; }
  header.top { position: absolute; left: 16px; bottom: 18px; z-index: 0; min-height: 0; padding: 0; }
  .site-brand { position: absolute; right: 86px; bottom: 18px; z-index: 0; margin-top: 0; }
  /* The divider runs nearly the full height of the screen, stopping above the desk when it's open. */
  .rail::before { display: none; }
  .rail-line { display: block; position: absolute; z-index: 2; right: calc(16px + var(--rail-w)); width: 1px; top: 14px; bottom: 22px; background: var(--line);
    transition: bottom .55s cubic-bezier(.3, .7, .2, 1); }
  .app:not(.desk-closed) .rail-line { bottom: calc(var(--desk-h, 210px) + 16px + 14px); }
  /* Same sizes either way; when closed the board drops a little from the top and the desk slides out of view. */
  .app { overflow: clip; }
  .upper, .desk { transition: transform .55s cubic-bezier(.3, .7, .2, 1), opacity .4s; }
  .app.desk-closed .desk { display: flex; transform: translateY(calc(100% + 40px)); opacity: 0; pointer-events: none; }

}
@media (prefers-reduced-motion: reduce) { .upper, .desk { transition: none !important; } }
@media (max-width: 720px) {
  .panel { grid-template-columns: minmax(0, 1fr); }
  .note-row { min-height: 0; }
}

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 10, .45); z-index: 100; display: flex; justify-content: flex-end; }

  background: var(--bg); width: min(920px, 100%); height: 100%; overflow: auto; box-sizing: border-box;
  padding-inline: 20px; padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));

}

.chat-log { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; min-height: 0; padding: 2px 2px 4px; }

.chat-name { font-weight: 700; font-size: .88em; }

.drawer { position: relative; overflow-x: auto; overflow-y: hidden; padding: 40px 12px 18px; margin-inline: -8px; outline: none; border-radius: var(--radius); background: color-mix(in srgb, var(--fg) 6%, transparent); scrollbar-width: thin; }
.drawer:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }

.fitem { position: absolute; top: 0; height: 410px; width: var(--w); box-sizing: border-box; border-radius: 4px 8px 8px 4px; cursor: pointer;
  transition: left .42s cubic-bezier(.25, .8, .25, 1), transform .42s cubic-bezier(.25, .8, .25, 1), box-shadow .42s;
  box-shadow: -4px 0 10px -6px rgba(0, 0, 0, .45); transform: translateY(6px); }
.fcard { background: var(--back); color: var(--back-ink); overflow: hidden; }

.fspine { position: absolute; left: 0; top: 0; width: 44px; padding-top: 14px; display: flex; justify-content: center; writing-mode: vertical-rl; font-family: var(--f-display); font-weight: 700; font-size: .82em; letter-spacing: .02em; white-space: nowrap; }

.cork.snap { width: 100%; height: 100%; aspect-ratio: auto; border-radius: 6px; }

.snap-board { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; width: min(100%, calc(320px * var(--snap-ar))); border-radius: 6px; overflow: hidden; background: var(--cork-line); }

/* The small board in a card's top-right corner; it opens large. */

.day-upd { margin: 4px 0 6px; padding: 8px 10px; border-radius: 8px; background: var(--back-line); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }

.ftab { position: absolute; top: -30px; left: var(--tab-x, 0px); height: 28px; padding: 0 12px; border-radius: 7px 7px 0 0; background: var(--manila); color: var(--manila-ink); display: flex; align-items: center; font-size: .74em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 -2px 4px -2px rgba(0, 0, 0, .25); }

/* Settings */

.swatches { display: flex; gap: 10px; flex-wrap: wrap; }

.board[data-layout="daily"] { display: block; background: none; box-shadow: none; border-radius: 0; overflow: visible; }

  /* ---------- the cork page: a shared board, everyone can pin notes under any of the four topics ---------- */
  const corkMine = () => S.cork.notes.filter((n) => n.authorId === S.myId);

    const n = clone(cur);

    n.updatedAt = Date.now();
    S.cork.notes[S.cork.notes.indexOf(cur)] = n;
    corkPending.add(id);

    clearTimeout(corkTimers[id]);

  function removeNote(id, quiet) {

      card.classList.add("flash");
      setTimeout(() => card.classList.remove("flash"), 900);
    });

  async function join(seat) {
    if (!S.db || !S.myId || !SEAT_NAME[seat]) return;
    if (holderOf(seat)) { toast(`Someone already joined as ${SEAT_NAME[seat]}.`); return; }
    try {
      await S.db.doc(`people/${S.myId}`).set({ joinedAt: Date.now(), tz: MY_TZ, seat });
    } catch (e) { writeErr(e); }
  }
  async function leave() {
    try { await S.db.doc(`people/${S.myId}`).delete(); S.confirmLeave = false; }
    catch (e) { writeErr(e); }

  /* ---------- dragging my notes on the board ---------- */
  document.addEventListener("pointerdown", (ev) => {
    const el = ev.target.closest(".note.own");
    if (!el || ev.button > 0) return;
    const id = el.dataset.note;
    const n = notesOf(myTodayDoc()).find((x) => x.id === id);
    if (!n) return;
    S.drag = { id, el, note: n, cork: el.closest(".cork").getBoundingClientRect(), sx: ev.clientX, sy: ev.clientY, ox: n.x, oy: n.y, x: n.x, y: n.y, moved: false };

  function makeGhost(n, w, text) {
    const g = document.createElement("div");
    g.className = "note-ghost";
    g.style.setProperty("--paper", PAPERS[n.color] || PAPERS.yellow);
    g.style.width = w + "px";
    g.textContent = text || " ";
    document.body.appendChild(g);
    fitText(g, w * .3 * noteScale());

  }
  document.addEventListener("pointermove", (ev) => {
    const d = S.drag;
    if (!d) return;
    const dx = ev.clientX - d.sx, dy = ev.clientY - d.sy;
    if (!d.moved && Math.hypot(dx, dy) < 5) return;
    if (!d.moved) { d.moved = true; d.el.classList.add("dragging"); document.body.classList.add("carrying"); SFX.thwip(); }
    bounceSeat(mySeat(), 900);
    // Off the cork, the note lifts off the board and follows the pointer, so it can go back to the desk.
    const c = d.cork;
    const onCork = ev.clientX >= c.left && ev.clientX <= c.right && ev.clientY >= c.top && ev.clientY <= c.bottom;
    const panel = $("#panel");
    if (!onCork) {
      const w = c.width * noteWPct(c) / 100;
      if (!d.ghost) { d.ghost = makeGhost(d.note, w, d.note.text); d.el.style.visibility = "hidden"; }
      d.ghost.style.left = ev.clientX - w / 2 + "px";

    d.y = clamp(d.oy + (dy / d.cork.height) * 100, 0, Math.max(0, 100 - (d.el.offsetHeight / d.cork.height) * 100));
    d.el.style.left = d.x + "%";
    d.el.style.top = d.y + "%";
  });
  function endDrag(cancelled) {
    const d = S.drag;
    if (!d) return;
    S.drag = null;
    S.pendingRender = false;
    $("#panel").classList.remove("drop-target");
    document.body.classList.remove("carrying");
    $("#trash").classList.remove("hot");
    if (d.ghost) {
      d.ghost.remove();
      if (!cancelled && d.overTrash) { removeNote(d.id); return; }
      if (!cancelled && d.overDesk) { unpinNote(d.id); return; }
      renderBoard();
      return;
    }
    if (cancelled) { renderBoard(); return; }
    if (d.moved) {
      const z = topZ();
      saveDay((doc) => { const n = doc.notes.find((x) => x.id === d.id); if (n) { n.x = +d.x.toFixed(2); n.y = +d.y.toFixed(2); n.z = z; } });

  /* ---------- history ---------- */
  // Cancels any in-progress close animation (and its pending hide) on a scrim being reopened, so a quick close-then-reopen can't un-hide it late.
  function openScrim(el) {
    if (!el) return;
    clearTimeout(S.sheetCloseTimer);
    el.classList.remove("closing");
    el.hidden = false;
  }
  async function openHistory() {
    S.history.open = true;
    openScrim($("#historyScrim"));
    renderHistory();
    await loadHistory();
  }
  // Each card in History is the whole board for one day: everyone's days are loaded and lined up by date.
  async function loadHistory() {
    const H = S.history, token = ++H.token;
    H.selDate = null;
    const people = SEAT_KEYS.map((k) => [k, holderOf(k)]).filter(([, m]) => m);
    if (!S.db || !people.length) { renderHistory(); return; }
    H.loading = true; H.days = [];
    renderHistory();
    const lists = await Promise.all(people.map(([k, m]) => S.db.collection(`people/${m.id}/days`).orderBy("date", "desc").limit(400).get()
      .then((snap) => [k, snap.docs.map((d) => d.data())], () => [k, null])));
    if (token !== H.token) return;
    if (lists.every(([, l]) => !l)) toast("Couldn't load history. Try again in a moment.");
    const byDate = {};
    for (const [k, list] of lists) for (const d of list || []) {

      (byDate[d.date] = byDate[d.date] || { date: d.date, seats: {} }).seats[k] = d;
    }
    H.days = Object.values(byDate);
    H.loading = false;
    renderHistory();

  // A past day reads like the list side of the board: the date, then the notes in board order.
  function historyDayHTML(d, opts) {

    const rows = boardOrder(notesOf(d).filter(placed)).map((n) => `<li class="task ${opts.match && !opts.match(n) ? "dim" : ""}"><span class="chip-dot" style="--paper:${PAPERS[n.color] || PAPERS.yellow}"></span><span class="t">${hl(n.text || "")}</span></li>`).join("");
    return `<article class="day">${head}${rows ? `<ol class="tasklist">${rows}</ol>` : ""}</article>`;

  // History is a card-file drawer: days stand side by side, oldest on the left, with a manila divider

    const quads = viewOrder().map((k) => {

      return `<div class="snap-q"><span class="snap-name">${esc(SEAT_NAME[k])}</span><div class="cork snap">${notes.map((n) => noteHTML(n, { mark: opts.mark, dim: opts.match ? !opts.match(n) : false })).join("")}</div></div>`;

  }
  // History shows one person at a time (me by default): their days in the card drawer, each card with the

  function historyWho() {
    const H = S.history;

  }
  // A small pill pair lets History switch between the day-by-day notes drawer and the shared message log.

      <button class="chip" type="button" data-act="hist-tab" data-tab="notes" aria-pressed="${H.tab !== "messages"}">Notes</button>
      <button class="chip" type="button" data-act="hist-tab" data-tab="messages" aria-pressed="${H.tab === "messages"}">Messages</button>
    </div>`;
  }
  function fmtMsgWhen(ms) {
    try { return new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }).format(new Date(ms)); }
    catch (e) { return ""; }
  }
  function chatMsgHTML(m, mark) {
    const author = S.members.find((x) => x.id === m.authorId);
    const seat = author ? author.seat : null;
    const name = seat ? SEAT_NAME[seat] : "Someone";
    const mine = m.authorId === S.myId;
    const editing = S.msgEditing === m.id;
    const hl = (t) => (mark ? mark(t) : esc(t));
    const body = editing
      ? `<div class="chat-edit"><textarea class="field" id="msg-edit-ta" maxlength="1500" aria-label="Edit your message">${esc(m.text)}</textarea>
          <div class="chat-edit-actions"><button type="button" class="btn small primary" data-act="msg-save" data-id="${esc(m.id)}">Save</button><button type="button" class="btn small" data-act="msg-cancel">Cancel</button></div></div>`
      : `<p class="chat-text">${hl(m.text || "")}</p>`;
    const tools = mine && !editing ? `<span class="grow"></span><button type="button" class="mini-btn" data-act="msg-edit" data-id="${esc(m.id)}" aria-label="Edit this message">${IC.pencil}</button><button type="button" class="mini-btn" data-act="msg-delete" data-id="${esc(m.id)}" aria-label="Delete this message">${IC.close}</button>` : "";
    return `<div class="chat-msg${mine ? " mine" : ""}">
      <span class="chat-av">${badge(seat || "", { still: true })}</span>
      <div class="chat-bubble">
        <div class="chat-meta"><span class="chat-name">${esc(name)}</span><span class="chat-time">${esc(fmtMsgWhen(m.createdAt))}${m.editedAt ? " · edited" : ""}</span>${tools}</div>
        ${body}
      </div>
    </div>`;
  }
  // The Messages tab is one shared, chronological log for the whole team, not a per-person view.
  function renderMessagesTab() {
    const H = S.history;
    const q = H.q.trim().toLowerCase();
    const re = q ? new RegExp(esc(H.q.trim()).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
    const mark = re ? (t) => esc(t).replace(re, (m) => `<mark>${m}</mark>`) : null;
    const msgs = S.messages.filter((m) => !q || (m.text || "").toLowerCase().includes(q)).sort((a, b) => a.createdAt - b.createdAt);
    keepFocus(() => {
      $("#history").innerHTML = `<div class="sheet-head"><h2 id="historyTitle">History</h2>
        <button class="icon-btn" type="button" data-act="close" aria-label="Close history">${IC.close}</button></div>
        ${historyTabsHTML()}
        <div class="search"><input class="field" id="in-search" type="search" placeholder="Search notes and messages" value="${esc(H.q)}" aria-label="Search notes and messages">
          <span class="muted">${msgs.length} ${msgs.length === 1 ? "message" : "messages"}${q ? " match" : ""}</span></div>
        <div class="chat-log" id="chatLog">${msgs.map((m) => chatMsgHTML(m, mark)).join("") || `<p class="muted">${q ? "Nothing matches that search." : team().length ? "No messages yet." : "No one has joined yet."}</p>`}</div>`;
    });
    const log = $("#chatLog");
    if (log && !q) log.scrollTop = log.scrollHeight;
  }
  function renderHistory() {
    if (!S.history.open) return;
    if (S.history.tab === "messages") { renderMessagesTab(); return; }
    const H = S.history;
    const q = H.q.trim().toLowerCase();
    const noteMatch = (n) => (n.text || "").toLowerCase().includes(q);
    const who = historyWho();
    const docMatch = (d) => notesOf(d).some(noteMatch);
    const days = (who ? H.days.filter((day) => day.seats[who]) : []).filter((day) => !q || docMatch(day.seats[who])).sort((a, b) => (a.date < b.date ? -1 : 1));
    const re = q ? new RegExp(esc(H.q.trim()).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
    const mark = re ? (t) => esc(t).replace(re, (m) => `<mark>${m}</mark>`) : null;
    const thisYear = myToday().slice(0, 4);
    const items = [];
    let month = "", tab = 0;
    for (const d of days) {
      const m = d.date.slice(0, 7);
      if (m !== month) {
        month = m;
        const label = new Intl.DateTimeFormat("en-GB", { month: "short", timeZone: "UTC" }).format(new Date(keyMs(m + "-01"))) + (m.slice(0, 4) !== thisYear ? " " + m.slice(2, 4) : "");
        items.push({ type: "div", label, tab: (tab++ % 3) * 18 });
      }
      items.push({ type: "day", d });
    }
    H.items = items;
    let sel = items.findIndex((it) => it.type === "day" && it.d.date === H.selDate);

          : `<article class="fitem fcard" data-act="drawer-pick" data-idx="${i}" role="option" aria-selected="${i === sel}" aria-label="${esc(fmtDay(it.d.date, true))}">

      $("#history").innerHTML = `<div class="sheet-head"><h2 id="historyTitle">History</h2>

        ${drawer}

    });
    layoutDrawer(false);
  }
  // The whole board for a day, enlarged over everything like a photo. Click anywhere or press Escape to close.
  function openBoardZoom(date) {

    const box = document.createElement("div");

  function closeBoardZoom() { const z = $("#boardZoom"); if (z) z.remove(); }
  // Place every card: each shows a strip, the chosen one opens to full width and the rest slide over.
  function layoutDrawer(smooth = true, nearest = false) {

    ev.preventDefault();
    wheelAcc += Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : ev.deltaY;
    while (Math.abs(wheelAcc) >= 60) { stepDrawer(wheelAcc > 0 ? 1 : -1); wheelAcc -= Math.sign(wheelAcc) * 60; }
  }, { passive: false });
  if (window.ResizeObserver) new ResizeObserver(() => layoutDrawer(false)).observe(document.querySelector("#history"));

  /* ---------- settings ---------- */
  function seg(key, options) {
    return `<div class="seg" role="group">${options.map(([v, l]) => `<button type="button" data-act="pref" data-k="${key}" data-v="${v}" aria-pressed="${String(S.prefs[key]) === String(v)}">${esc(l)}</button>`).join("")}</div>`;
  }
  function renderSettings() {
    if (!S.settingsOpen) return;
    const p = S.prefs;
    const others = SEAT_KEYS.filter((k) => k !== mySeat());
    const order = viewOrder();
    $("#settings").innerHTML = `<div class="sheet-head"><h2 id="settingsTitle">Settings</h2>
        <button class="icon-btn" type="button" data-act="close" aria-label="Close settings">${IC.close}</button></div>
      ${mySeat() && canWrite() ? `<div class="group"><span class="lbl">My avatar</span>
          ${window.DaybookAvatar ? avatarBuilderHTML() : `<span class="muted">The avatar maker didn't load. Reload the page to try again.</span>`}</div>` : ""}
      <div class="group"><span class="lbl">Positions</span>
        <div class="positions" role="group" aria-label="Board positions">${order.map((k, i) => `<button type="button" data-act="swap" data-seat="${k}" aria-pressed="${S.swapPick === k}">${esc(SEAT_NAME[k])}<small>${["Top left", "Top right", "Bottom left", "Bottom right"][i]}</small></button>`).join("")}</div>
        <span class="muted" style="font-size:.88em">${S.swapPick ? `Now tap where ${esc(SEAT_NAME[S.swapPick])} should go.` : ""}</span></div>
      <div class="group"><span class="lbl">Daily Update positions</span>
        <div class="positions" role="group" aria-label="Daily Update positions">${dailyViewOrder().map((k, i) => `<button type="button" data-act="daily-swap" data-seat="${k}" aria-pressed="${S.dailySwapPick === k}">${esc(SEAT_NAME[k])}<small>${["North", "West", "East", "South"][i]}</small></button>`).join("")}</div>
        <span class="muted" style="font-size:.88em">${S.dailySwapPick ? `Now tap where ${esc(SEAT_NAME[S.dailySwapPick])} should go.` : ""}</span></div>
      <div class="group"><span class="lbl">New note color</span><div class="swatches">${Object.entries(PAPERS).map(([k, c]) => `<button class="swatch" type="button" data-act="pref" data-k="paper" data-v="${k}" aria-pressed="${p.paper === k}" aria-label="${k}" style="background:${c}"></button>`).join("")}</div></div>
      <div class="group"><span class="lbl">Accent</span><div class="swatches">${Object.entries(ACCENTS).map(([k, c]) => `<button class="swatch" type="button" data-act="pref" data-k="accent" data-v="${k}" aria-pressed="${p.accent === k}" aria-label="${k}" style="background:linear-gradient(135deg, ${c[0]} 50%, ${c[1]} 50%)"></button>`).join("")}</div></div>
      <div class="group"><span class="lbl">Background</span>${seg("map", [["false", "Plain"], ["true", "Map"]])}</div>
      <div class="group"><span class="lbl">Sounds</span>${seg("sound", [["true", "On"], ["false", "Off"]])}</div>
      ${p.map ? `<p class="muted" style="margin:auto 0 0;font-size:.75em">Map data: Natural Earth; lakes © OpenStreetMap contributors.</p>` : ""}`;
  }

  /* ---------- events ---------- */
  function closeSheets() {
    closeBoardZoom();
    const open = ["#historyScrim", "#settingsScrim", "#queueScrim"].map($).filter((s) => s && !s.hidden);
    S.history.open = false; S.settingsOpen = false; S.confirmLeave = false; S.swapPick = null; S.queueOpen = false; S.dailySwapPick = null; S.msgEditing = null;
    if (!open.length) return;
    open.forEach((s) => s.classList.add("closing"));
    clearTimeout(S.sheetCloseTimer);
    S.sheetCloseTimer = setTimeout(() => open.forEach((s) => { s.hidden = true; s.classList.remove("closing"); }), 170);
  }
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act;
    if (act === "scrim") { if (ev.target === b) closeSheets(); return; }
    switch (act) {
      case "open-history": if (b.dataset.tab) S.history.tab = b.dataset.tab; openHistory(); break;
      case "open-settings": S.settingsOpen = true; openScrim($("#settingsScrim")); renderSettings(); break;
      case "close": closeSheets(); break;
      case "page": {
        const p = PAGE_ORDER.includes(b.dataset.page) ? b.dataset.page : "board";
        if (p === S.page) {
          if (!S.deskOpen) { S.deskOpen = true; applyDesk(); SFX.whoosh(true); }
          break;
        }
        const dir = PAGE_ORDER.indexOf(p) > PAGE_ORDER.indexOf(S.page) ? "page-anim-right" : "page-anim-left";
        S.page = p; LS.set("daybook.page", p); renderAll();
        playAnim($("#board"), dir);
        playAnim($("#panel"), "page-fade");
        break;
      }
      case "daily-post": { const ta = $("#in-daily"); if (ta && ta.value.trim()) postDaily(ta.value); break; }
      case "daily-clear": { S.dailyDraft = ""; LS.set("daybook.dailyDraft", ""); renderPanel(); $("#in-daily")?.focus(); break; }
      case "daily-edit": {
        const vis = visibleDaily(myTodayDoc());
        if (!vis) break;
        S.dailyDraft = vis.text; LS.set("daybook.dailyDraft", vis.text);
        renderPanel();
        if (!S.deskOpen) { S.deskOpen = true; applyDesk(); }
        setTimeout(() => $("#in-daily")?.focus(), 50);
        break;
      }
      case "daily-queue-open": {
        const ta = $("#in-daily");
        if (ta) { S.dailyDraft = ta.value; LS.set("daybook.dailyDraft", ta.value); }
        if (!(S.dailyDraft || "").trim()) { toast("Write your update first."); break; }
        S.queueOpen = true; openScrim($("#queueScrim")); renderQueueSheet();
        setTimeout(() => $("#in-daily-time")?.focus(), 50);
        break;
      }
      case "daily-queue-set": queueDaily(); break;
      case "daily-queue-cancel": cancelDailyQueue(); break;
      case "daily-queue-edit": {
        const doc = myTodayDoc(), q = doc && doc.dailyQueue;
        if (!q) break;
        S.dailyDraft = q.text; LS.set("daybook.dailyDraft", q.text);
        const d = new Date(q.showAt);
        S.dailyQTime = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
        renderPanel();
        S.queueOpen = true; openScrim($("#queueScrim")); renderQueueSheet();
        setTimeout(() => $("#in-daily-time")?.focus(), 50);
        break;
      }
      case "daily-swap": {
        const k = b.dataset.seat;
        if (!S.dailySwapPick || S.dailySwapPick === k) { S.dailySwapPick = S.dailySwapPick === k ? null : k; renderSettings(); break; }
        const o = dailyViewOrder();
        const i = o.indexOf(S.dailySwapPick), j = o.indexOf(k);
        [o[i], o[j]] = [o[j], o[i]];
        S.dailySwapPick = null;
        setPref("dailyOrder", o);
        break;
      }
      case "canary-poke": canaryReact(); break;
      case "canary-greet": canaryGreet(b); break;
      case "join": join(b.dataset.seat); break;
      case "add-note": if (S.page === "cork") addCorkNote(); else addNote(); break;
      case "desk-toggle": if (S.deskOpen) { S.deskOpen = false; applyDesk(); SFX.whoosh(false); break; }
      // falls through to open
      case "desk-open": S.deskOpen = true; applyDesk(); SFX.whoosh(true); setTimeout(() => $("#in-update")?.focus({ preventScroll: true }), 450); break;
      case "desk-close": S.deskOpen = false; applyDesk(); SFX.whoosh(false); break;
      case "post-all": postAll(); break;
      case "heart": toggleHeart(b.dataset.note, b.closest(".quad")?.dataset.key); break;
      case "hist-who": S.history.who = b.dataset.seat || null; S.history.selDate = null; SFX.tick(); renderHistory(); break;
      case "board-zoom": openBoardZoom(b.dataset.date); break;
      case "zoom-close": closeBoardZoom(); break;
      case "unpin-all": if (S.page === "cork") unpinAllCork(); else unpinAll(); break;
      case "list-open": S.listOpen = !S.listOpen; renderPanel(); if (S.listOpen) $("#in-list")?.focus(); break;
      case "list-cancel": S.listOpen = false; S.listDraft = ""; renderPanel(); break;
      case "list-make": if (S.page === "cork") makeCorkFromList(); else makeFromList(); break;
      case "av-pick": { const c = S.avBatch && S.avBatch[+b.dataset.i]; if (c) { setAvatar({ ...c }); SFX.boop(); } break; }
      case "av-batch": newBatch(); renderSettings(); break;
      case "quick": {
        const ta = $("#in-update"), text = QUICK_UPDATES[+b.dataset.i][1];
        if (ta) { ta.value = text; S.msgDraft = text; LS.set("daybook.msgDraft", text); ta.focus(); ta.setSelectionRange(text.length, text.length); }
        SFX.tick();
        break;
      }
      case "upd-submit": { const ta = $("#in-update"); const v = ta ? ta.value : ""; if (v.trim()) { clearMsgDraft(); postMessage(v); } $("#in-update")?.focus(); break; }
      case "hist-tab": S.history.tab = b.dataset.tab; renderHistory(); break;
      case "msg-edit": S.msgEditing = b.dataset.id; renderHistory(); setTimeout(() => { const ta = $("#msg-edit-ta"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }, 0); break;
      case "msg-cancel": S.msgEditing = null; renderHistory(); break;
      case "msg-save": { const ta = $("#msg-edit-ta"); if (ta && ta.value.trim()) editMessage(b.dataset.id, ta.value); else { S.msgEditing = null; renderHistory(); } break; }
      case "msg-delete": deleteMessage(b.dataset.id); break;
      case "card-color": {
        const id = b.dataset.id, color = b.dataset.color;
        if (S.page === "cork") saveCorkNote(id, (n) => { n.color = color; });
        else saveDay((d) => { const n = d.notes.find((x) => x.id === id); if (n) n.color = color; });
        const card = b.closest(".card");
        card.style.setProperty("--paper", PAPERS[color]);
        card.querySelectorAll(".dot").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        break;
      }
      case "card-delete": if (S.page === "cork") removeCorkNote(b.dataset.id); else removeNote(b.dataset.id); break;
      case "drawer-pick": {
        const items = S.history.items || [];
        let i = +b.dataset.idx;
        if (items[i] && items[i].type === "div") i = items.findIndex((it, j) => j > i && it.type === "day");
        if (i >= 0 && items[i]) selectDrawer(i);
        break;
      }
      case "pref": setPref(b.dataset.k, b.dataset.k === "sound" || b.dataset.k === "map" ? b.dataset.v === "true" : b.dataset.v); if (b.dataset.k === "sound" && b.dataset.v === "true") SFX.boop(); break;
      case "swap": {
        const k = b.dataset.seat;
        if (!S.swapPick || S.swapPick === k) { S.swapPick = S.swapPick === k ? null : k; renderSettings(); break; }
        const o = viewOrder();
        const i = o.indexOf(S.swapPick), j = o.indexOf(k);
        [o[i], o[j]] = [o[j], o[i]];
        S.swapPick = null;
        setPref("order", o);
        break;
      }
      case "leave": S.confirmLeave = true; renderSettings(); break;
      case "leave-no": S.confirmLeave = false; renderSettings(); break;
      case "leave-yes": leave().then(renderSettings); break;
    }
  });
  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.id === "in-list") {
      S.listDraft = t.value;
      const btn = $("#list-make");
      if (btn) btn.textContent = listLabel(t.value);
      return;
    }
    if (t.dataset.cardText) {
      fitCard(t);
      const id = t.dataset.cardText, v = t.value;
      if (S.page === "cork") saveCorkNote(id, (n) => { n.text = v; }, { delay: 700 });
      else saveDay((d) => { const n = d.notes.find((x) => x.id === id); if (n) n.text = v; }, { delay: 700 });
    } else if (t.id === "in-update") {
      S.msgDraft = t.value;
      LS.set("daybook.msgDraft", t.value);
    } else if (t.id === "in-daily") {
      S.dailyDraft = t.value;
      LS.set("daybook.dailyDraft", t.value);
      t.closest(".daily-field-wrap")?.classList.toggle("has-text", !!t.value.trim());
    } else if (t.id === "in-daily-time") {
      S.dailyQTime = t.value;
    } else if (t.id === "in-search") { S.history.q = t.value; renderHistory(); }
  });
  document.addEventListener("focusout", (ev) => {
    const t = ev.target;
    if (t.isConnected && t.closest && $("#panel").contains(t)) setTimeout(flushPanel, 0);
  });
  document.addEventListener("keydown", (ev) => {
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches('.heart[data-act="heart"]')) { ev.preventDefault(); ev.target.click(); return; }
    const t = ev.target;
    // Enter posts the message to the board; Shift+Enter adds a new line.
    if (t.id === "in-update" && ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
      ev.preventDefault();
      const v = t.value;
      if (v.trim()) { clearMsgDraft(); postMessage(v); }
      return;
    }
    if (t.classList && t.classList.contains("own") && t.dataset.note) {
      const id = t.dataset.note;
      const step = ev.shiftKey ? 5 : 1;
      const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[ev.key];
      if (mv) {
        ev.preventDefault();
        saveDay((d) => { const n = d.notes.find((x) => x.id === id); if (n) { n.x = clamp(n.x + mv[0], 0, 100 - myNoteW()); n.y = clamp(n.y + mv[1], 0, 100 - myNoteH()); } });
        requestAnimationFrame(() => document.querySelector(`.note.own[data-note="${CSS.escape(id)}"]`)?.focus());
        return;
      }
      if (ev.key === "Delete" || ev.key === "Backspace") { ev.preventDefault(); removeNote(id); return; }
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); unpinNote(id); return; }
    }
    if (t.id === "drawer" && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(ev.key)) {
      ev.preventDefault();
      if (ev.key === "ArrowLeft") stepDrawer(-1);
      else if (ev.key === "ArrowRight") stepDrawer(1);
      else {
        const items = S.history.items || [];
        const idx = items.map((it, i) => (it.type === "day" ? i : -1)).filter((i) => i >= 0);
        if (idx.length) selectDrawer(ev.key === "Home" ? idx[0] : idx[idx.length - 1]);
      }
      return;
    }
    if (ev.key === "Escape") {
      if ($("#boardZoom")) closeBoardZoom();
      else if (!$("#historyScrim").hidden || !$("#settingsScrim").hidden) closeSheets();
      else if (t.closest && t.closest(".name-tag")) t.blur();
    }
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.dataset.show) {
      const id = t.dataset.show;
      const hidden = S.prefs.hidden.filter((x) => x !== id);
      if (!t.checked) hidden.push(id);
      setPref("hidden", hidden);
    }
  });

  /* ---------- boot ---------- */
  let lastDay = myToday();
  setInterval(() => {
    const k = myToday();
    if (k !== lastDay && !S.drag && !panelBusy()) { if (flushTimer) flush(lastDay); lastDay = k; S.local = {}; renderAll(); carryOver(); }
  }, 60000);

  async function boot() {
    applyPrefs();
    applyDesk();
    renderAll();
    const c = window.claude;
    if (!c || typeof c.use !== "function") { S.ready = true; renderAll(); return; }
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    S.db = db; S.user = user;
    if (!db) { S.ready = true; renderAll(); return; }
    S.myId = user ? await user.id() : null;
    if (user && (await user.can("data.write")) === false) S.readOnly = true;
    if (S.myId) {
      try {
        const p = await db.doc(`data/users/${S.myId}/prefs`).get();
        if (p.exists) {
          S.prefs = { ...DEFAULT_PREFS, ...p.data() };
          S.prefs.hidden = (S.prefs.hidden || []).filter((k) => SEAT_NAME[k]);
          LS.set("daybook.prefs", S.prefs); applyPrefs();
        }
      } catch (e) {}
    }
    db.collection("people").orderBy("joinedAt").limit(12).onSnapshot(onMembers, () => {
      S.ready = true;
      showNotice("Lost the connection to the board. Reload the page to reconnect.");
      renderAll();
    });
    db.collection("cork").onSnapshot(
      (snap) => { corkApplySnapshot(snap.docs); S.cork.ready = true; if (S.page === "cork") renderAll(); },
      () => { S.cork.notes = []; S.cork.ready = true; if (S.page === "cork") renderAll(); }
    );
    db.collection("messages").orderBy("createdAt", "desc").limit(MAX_MESSAGES).onSnapshot(
      (snap) => { applyMessagesSnapshot(snap.docs); renderBoard(); if (S.history.open) renderHistory(); },
      () => { S.messages = []; renderBoard(); if (S.history.open) renderHistory(); }
    );
  }
  boot();
})();
</script>
